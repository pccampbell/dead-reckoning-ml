[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dead-reckoning-ml"
version = "0.1.0"
description = "Local-first historical equity data for trading research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alpaca-py>=0.43,<1",
  "duckdb>=1.4,<2",
  "polars>=1.35,<2",
  "pyarrow>=22,<24",
  "pydantic-settings>=2.11,<3",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "typer>=0.20,<1",
  "tzdata>=2025.2",
]

[project.scripts]
dead-reckoning = "dead_reckoning.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/dead_reckoning"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
